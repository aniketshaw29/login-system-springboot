# =============================================================================
# application.properties — Spring Boot Configuration File
# =============================================================================
#
# WHAT IS THIS FILE?
# ──────────────────
# This is the main config file for your Spring Boot application.
# Spring reads this file on startup to configure the entire application.
#
# THINK OF IT LIKE: environment variables for your app.
# Instead of hardcoding database URLs, ports, secrets in your Java code,
# you put them here. This makes it easy to change config per environment
# (dev, staging, production) without touching code.
#
# FORMAT: key=value (one per line, # starts a comment)
# =============================================================================


# =============================================================================
# SERVER CONFIGURATION
# =============================================================================

# The port your application listens on.
# Default is 8080. Changing to 8080 explicitly (standard HTTP dev port).
# In production you'd typically run on 80 (HTTP) or 443 (HTTPS).
server.port=8080


# =============================================================================
# DATABASE CONFIGURATION (H2 In-Memory)
# =============================================================================
#
# H2 is our in-memory database for development.
# The URL "jdbc:h2:mem:logindb" means:
#   jdbc = Java Database Connectivity (standard Java DB protocol)
#   h2   = H2 database driver
#   mem  = in-memory (not persisted to disk)
#   logindb = the name of our database
#
# "mem:logindb;DB_CLOSE_DELAY=-1" keeps the DB alive as long as the app runs
# (by default H2 closes the DB when the last connection closes)

spring.datasource.url=jdbc:h2:mem:logindb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# =============================================================================
# JPA / HIBERNATE CONFIGURATION
# =============================================================================
#
# hibernate.ddl-auto controls what Hibernate does with your DB schema:
#   none        = do nothing (you manage schema manually)
#   validate    = verify schema matches entities, fail if not
#   update      = update schema if needed (don't drop data) ← safe for dev
#   create      = create schema on startup (drops data!)
#   create-drop = create on start, drop on stop ← good for testing
#
# We use "create-drop" so the schema is always fresh. In production
# you would use "validate" or "none" and manage migrations with Flyway.

spring.jpa.hibernate.ddl-auto=create-drop

# Show the SQL queries Hibernate generates in the console.
# Very useful for learning — you can see exactly what SQL runs!
# Set to false in production (too noisy).
spring.jpa.show-sql=true

# Format the SQL nicely (with indentation) in the console
spring.jpa.properties.hibernate.format_sql=true

# The database dialect tells Hibernate what SQL "flavor" to use.
# H2Dialect generates SQL compatible with H2's syntax.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect


# =============================================================================
# H2 CONSOLE (Web UI for the in-memory database)
# =============================================================================
#
# H2 provides a browser-based SQL console at http://localhost:8080/h2-console
# You can browse tables, run SQL queries, inspect data — great for learning!
#
# HOW TO USE:
#   1. Start the app
#   2. Open http://localhost:8080/h2-console
#   3. JDBC URL: jdbc:h2:mem:logindb
#   4. Username: sa | Password: (empty)
#   5. Click Connect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Allow H2 console to work even with Spring Security enabled
# (We'll also configure this in SecurityConfig.java)
spring.h2.console.settings.web-allow-others=false


# =============================================================================
# JWT CONFIGURATION
# =============================================================================
#
# These are custom properties we defined. Spring doesn't know about them
# by default — we'll read them in our JwtUtil class using @Value("${...}")
#
# SECRET KEY: Used to SIGN and VERIFY the JWT token.
#   - Must be kept secret! If someone gets this, they can forge tokens.
#   - In production: store in environment variables or a secrets manager
#     (AWS Secrets Manager, HashiCorp Vault, etc.) — NEVER in code or
#     a committed config file.
#
# JWT_SECRET is a 64-character hex string (256 bits) — strong enough for
# the HS256 algorithm we'll use. Generate a new one for real apps.

app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=86400000
# ↑ 86400000 milliseconds = 24 hours (1000ms * 60s * 60min * 24h)
# Tokens expire after 24 hours. User must log in again.


# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
#
# Log levels: TRACE < DEBUG < INFO < WARN < ERROR
# Only messages at or above the configured level are shown.
#
# Spring Security logs can be very verbose. Uncomment the DEBUG line
# to see exactly what Spring Security is doing with each request
# (very educational!).

logging.level.org.springframework.security=INFO
# logging.level.org.springframework.security=DEBUG   # ← uncomment for details
logging.level.com.example.loginsystem=DEBUG
